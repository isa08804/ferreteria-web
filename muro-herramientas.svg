    <path d="M0 20h58a10 10 0 0 1 10 10v18a10 10 0 0 1-10 10H0z" fill="#4A5C68"/>
    <path d="M0 20 L-22 6 L-26 30 L-14 58 L0 58z" fill="#16232E"/>
  </g>

