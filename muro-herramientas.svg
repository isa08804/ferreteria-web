    <path d="M206 82 q23 -19 46 0" fill="none" stroke="#16232E" stroke-width="5" stroke-linecap="round"/>
    <rect x="286" y="92" width="58" height="40" rx="4" fill="#4A5C68"/>
    <path d="M295 92 q20 -16 40 0" fill="none" stroke="#16232E" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Cinta métrica extendida sobre la repisa -->
