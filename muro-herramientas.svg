<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Muro de herramientas de una ferretería">
  <defs>
    <pattern id="perforado" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="2.6" fill="#16232E" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#DCDDD6"/>
  <rect width="800" height="600" fill="url(#perforado)"/>

  <!-- Repisa superior -->
  <rect x="60" y="132" width="680" height="12" rx="3" fill="#16232E"/>
  <rect x="60" y="144" width="680" height="7" fill="#4A5C68"/>

  <!-- Botes de pintura sobre la repisa -->
  <g>
    <rect x="96" y="72" width="76" height="60" rx="4" fill="#C1352B"/>
    <rect x="96" y="86" width="76" height="16" fill="#F7F7F4" opacity="0.9"/>
    <path d="M108 72 q26 -22 52 0" fill="none" stroke="#16232E" stroke-width="5" stroke-linecap="round"/>
    <rect x="196" y="82" width="66" height="50" rx="4" fill="#F5C518"/>
