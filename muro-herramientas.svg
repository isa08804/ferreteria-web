  <g stroke="#16232E" stroke-width="3">
    <path d="M20 540v18M50 540v28M80 540v18M110 540v28M140 540v18M170 540v28M200 540v18M230 540v28M260 540v18M290 540v28M320 540v18M350 540v28M380 540v18M410 540v28M440 540v18M470 540v28M500 540v18M530 540v28M560 540v18M590 540v28M620 540v18M650 540v28M680 540v18M710 540v28M740 540v18M770 540v28"/>
