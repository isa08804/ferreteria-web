  <rect x="60" y="452" width="680" height="12" rx="3" fill="#16232E"/>
  <rect x="60" y="464" width="680" height="7" fill="#4A5C68"/>
  <g>
    <rect x="96" y="382" width="120" height="70" fill="#B7A98C"/>
    <rect x="96" y="408" width="120" height="12" fill="#16232E" opacity="0.25"/>
    <rect x="236" y="396" width="96" height="56" fill="#B7A98C"/>
    <rect x="236" y="416" width="96" height="10" fill="#16232E" opacity="0.25"/>
    <rect x="352" y="374" width="132" height="78" fill="#F5C518"/>
    <rect x="352" y="404" width="132" height="14" fill="#16232E" opacity="0.35"/>
    <rect x="504" y="392" width="110" height="60" fill="#B7A98C"/>
    <rect x="504" y="414" width="110" height="10" fill="#16232E" opacity="0.25"/>
    <rect x="634" y="386" width="106" height="66" fill="#4A5C68"/>
    <rect x="634" y="412" width="106" height="12" fill="#16232E" opacity="0.35"/>
